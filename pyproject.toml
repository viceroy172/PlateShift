[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plateshift"
dynamic = ["version"]
description = "Convert Bambu Studio / MakerWorld 3MF projects for other printers, offline."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
plateshift = "plateshift.__main__:main"

[project.gui-scripts]
plateshift-gui = "plateshift.gui:main"

[tool.setuptools]
packages = ["plateshift"]

[tool.setuptools.dynamic]
version = { attr = "plateshift.__version__" }
