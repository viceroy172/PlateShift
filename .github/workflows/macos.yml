name: macos

# real-world checks on a mac: plateshift against the official orcaslicer for
# macos, and the PlateShift.app build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ORCA_VERSION: "2.5.1"

jobs:
  orcaslicer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install OrcaSlicer ${{ env.ORCA_VERSION }}
        run: |
          curl -sSL -o orca.dmg "https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v${ORCA_VERSION}/OrcaSlicer_Mac_universal_V${ORCA_VERSION}.dmg"
          hdiutil attach -nobrowse -quiet -mountpoint /Volumes/orca orca.dmg
          cp -R /Volumes/orca/*.app /Applications/
          hdiutil detach /Volumes/orca -quiet
          ls /Applications | grep -i orca
      - name: plateshift finds the app and its profiles by itself
        run: |
          python -c "from plateshift.slicers import find_slicers; print(find_slicers())"
          python -m plateshift filaments --printer c5p | head -3
          python -m plateshift filaments --printer k1max | head -3
      - name: convert a bambu project and test slice it
        run: |
          app=$(ls -d /Applications/Orca*Slicer*.app | head -1)
          python -c "import sys; from pathlib import Path; from plateshift.slicers import bundle_exe; print(bundle_exe(Path(sys.argv[1])))" "$app" > exe.txt
          python tools/e2e.py --profiles "$app/Contents/Resources/profiles" --slicer "$(cat exe.txt)"

  screenshots:
    # only when started by hand: pictures of the window for the README
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install OrcaSlicer ${{ env.ORCA_VERSION }}
        run: |
          curl -sSL -o orca.dmg "https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v${ORCA_VERSION}/OrcaSlicer_Mac_universal_V${ORCA_VERSION}.dmg"
          hdiutil attach -nobrowse -quiet -mountpoint /Volumes/orca orca.dmg
          cp -R /Volumes/orca/*.app /Applications/
          hdiutil detach /Volumes/orca -quiet
      - name: take the screenshots
        run: |
          app=$(ls -d /Applications/Orca*Slicer*.app | head -1)
          python tools/screenshots.py --profiles "$app/Contents/Resources/profiles" --out shots
      - uses: actions/upload-artifact@v4
        with:
          name: mac-screenshots
          path: shots/

  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build PlateShift.app
        run: |
          python -m pip install --quiet pyinstaller
          python -m PyInstaller --noconfirm --windowed --name PlateShift --paths . \
            --icon packaging/icon.icns \
            --osx-bundle-identifier io.github.viceroy172.plateshift packaging/plateshift_app.py
          # finder's Get Info shows this version
          version=$(python -c "import plateshift; print(plateshift.__version__)")
          plutil -replace CFBundleShortVersionString -string "$version" dist/PlateShift.app/Contents/Info.plist
          plutil -replace CFBundleVersion -string "$version" dist/PlateShift.app/Contents/Info.plist
          # editing Info.plist breaks the signature pyinstaller made, and macOS then
          # calls the downloaded app "damaged". sign it again (ad hoc) after the edit
          codesign --verify --deep --strict dist/PlateShift.app \
            && echo "signature still valid after the plist edit" \
            || echo "signature broken by the plist edit, re-signing"
          codesign --force --deep --sign - dist/PlateShift.app
          codesign --verify --deep --strict --verbose=2 dist/PlateShift.app
      - name: the app runs
        run: dist/PlateShift.app/Contents/MacOS/PlateShift printers
      - name: zip it
        run: |
          ditto -c -k --keepParent dist/PlateShift.app PlateShift-mac.zip
          # the zip must unpack to an app whose signature still checks out
          mkdir unzipped && ditto -x -k PlateShift-mac.zip unzipped
          codesign --verify --deep --strict --verbose=2 unzipped/PlateShift.app
      - uses: actions/upload-artifact@v4
        with:
          name: PlateShift-mac
          path: PlateShift-mac.zip
